<div class="sheet">

  <header class="masthead">
    <svg class="bloom bloom--a" viewBox="0 0 48 64" aria-hidden="true" focusable="false"><use href="#g-flower-a"/></svg>
    <p class="kicker" id="masthead-kicker"></p>
    <h1 class="masthead__title">
      <span id="masthead-title"></span>
      <svg class="squiggle" viewBox="0 0 200 14" aria-hidden="true" focusable="false"><use href="#g-squiggle"/></svg>
    </h1>
    <p class="masthead__intro" id="masthead-intro"></p>
  </header>

  <section class="band" aria-labelledby="notes-h">
    <h2 class="band__h" id="notes-h"></h2>
    <ul class="notes" id="notes-list"></ul>
  </section>

  <section class="band" id="week" aria-labelledby="week-h">
    <h2 class="band__h" id="week-h"></h2>
    <div class="days" id="day-tabs" role="tablist" aria-label="Day of the week"></div>
    <div id="day-panels"></div>
  </section>

  <section class="band" aria-labelledby="map-h">
    <h2 class="band__h" id="map-h"></h2>
    <p class="band__hint" id="map-hint"></p>
    <div class="mapwrap">
      <div id="map" role="application"></div>
    </div>
    <div class="legend" id="map-legend"></div>
  </section>

  <section class="band" aria-labelledby="dir-h">
    <h2 class="band__h" id="dir-h"></h2>

    <form class="filters" id="filters">
      <fieldset class="filterset">
        <legend class="filterset__legend" id="filter-cat-legend"></legend>
        <div class="chips" id="filter-categories"></div>
      </fieldset>
      <fieldset class="filterset">
        <legend class="filterset__legend" id="filter-dist-legend"></legend>
        <div class="chips" id="filter-districts"></div>
      </fieldset>
      <div class="filters__foot">
        <button type="button" class="btn btn--ghost" id="clear-filters"></button>
        <p class="count" id="result-count" role="status" aria-live="polite"></p>
      </div>
    </form>

    <div class="cards" id="venue-list"></div>
    <p class="empty" id="venue-empty" hidden></p>
  </section>

  <footer class="footer">
    <h2 class="footer__h" id="unmapped-h"></h2>
    <ul class="footer__list" id="unmapped-list"></ul>
    <p class="footer__note" id="footer-data-note"></p>
    <p class="footer__note" id="footer-heritage-note"></p>
    <p class="footer__credit">Map data &copy; OpenStreetMap contributors. Tiles from openstreetmap.org.</p>
    <svg class="bloom bloom--b" viewBox="0 0 44 58" aria-hidden="true" focusable="false"><use href="#g-flower-b"/></svg>
  </footer>

</div>
